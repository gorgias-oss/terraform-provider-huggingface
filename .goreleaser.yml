# GoReleaser config for the Terraform Registry.
#
# Required secrets (set in the GitHub repo / org settings):
#   GPG_PRIVATE_KEY  — ASCII-armored, exported private key
#   PASSPHRASE       — passphrase for the key (empty if key is unencrypted)
#
# Driven by .github/workflows/release.yml on `v*` tags.
# Visit https://goreleaser.com for documentation on how to customize this behavior.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: terraform-provider-huggingface
    binary: '{{ .ProjectName }}_v{{ .Version }}'
    env:
      # goreleaser does not work with CGO; disabling it also keeps the binaries
      # usable in CI/CD systems like HCP Terraform where users are unable to
      # install libraries.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: windows
        goarch: arm # windows/arm (32-bit) is not a supported Go target

archives:
  - formats: ['zip']
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # If you are using this in a GitHub action or some other automated
      # pipeline, you need to pass the batch flag to indicate it is not
      # interactive.
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}' # set this environment variable for your signing key
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  # If you want to manually examine the release before it is live, set draft: true.
  draft: false
  prerelease: auto

changelog:
  disable: true
